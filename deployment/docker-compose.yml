services:
  cinemap-app:
    image: cinemap-app:latest
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:3088:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://78.138.58.95/cinemap-app
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - cinemap_storage:/var/www/html/storage
      - cinemap_database:/var/www/html/database

volumes:
  cinemap_storage:
  cinemap_database:
