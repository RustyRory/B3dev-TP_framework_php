name: Deploy to VPS (staging)

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinemap-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: ./vendor/bin/pint --test

  tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinemap-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan jwt:secret --force
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
      - run: ./vendor/bin/pest --ci

  deploy:
    name: Déploiement CineMap — staging
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - name: Trigger update via vps-monitor
        run: |
          # Login — récupère le cookie de session
          curl -sf -c cookies.txt \
            -X POST "${{ secrets.VPS_MONITOR_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.VPS_MONITOR_USER }}","password":"${{ secrets.VPS_MONITOR_PASS }}"}' \
            | grep -q '"ok":true' || { echo "Échec login vps-monitor"; exit 1; }

          # Déclenche git pull + docker compose up --build
          curl -sf -b cookies.txt \
            -X POST "${{ secrets.VPS_MONITOR_URL }}/api/deploy/update" \
            -H "Content-Type: application/json" \
            -d '{"name":"cinemap-app"}' \
            | grep -q '"ok":true' || { echo "Échec update vps-monitor"; exit 1; }

          echo "Déploiement déclenché : http://78.138.58.95/cinemap-app/"
